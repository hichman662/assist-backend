<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Object Detection</title>
    <script src="https://cdn.socket.io/4.5.1/socket.io.min.js"></script>
    <style>
        #video {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }
        #object-list {
            position: absolute;
            bottom: 80px;
            left: 10px;
            color: black;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }
        #distance-line {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            color: white;
            background: black;
            text-align: center;
            font-size: 20px;
            padding: 5px;
        }
        .warning {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <video id="video" autoplay></video>
    <canvas id="canvas"></canvas>
    <div id="object-list"></div>
    <div id="distance-line"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const objectList = document.getElementById('object-list');
        const distanceLine = document.getElementById('distance-line');
        const ctx = canvas.getContext('2d');

        // Initialize Socket.IO connection
        const socket = io.connect('http://localhost:5000');

        let previousDetections = [];

        // Helper to check significant changes in detections
        function hasSignificantChange(newDetections, oldDetections) {
            if (newDetections.length !== oldDetections.length) return true;

            for (let i = 0; i < newDetections.length; i++) {
                if (
                    newDetections[i].label !== oldDetections[i].label ||
                    Math.abs(newDetections[i].distance - oldDetections[i].distance) > 0.1
                ) {
                    return true;
                }
            }
            return false;
        }

        // WebSocket Events
        socket.on('connect', () => {
            console.log('Socket.IO connection established');
        });

        socket.on('disconnect', () => {
            console.log('Socket.IO connection lost');
            distanceLine.textContent = 'WebSocket connection lost. Trying to reconnect...';
        });

        socket.on('detection_result', data => {
            if (data.error) {
                distanceLine.textContent = `Error: ${data.error}`;
            } else if (data.detections && Array.isArray(data.detections)) {
                // Sort detections by distance
                const sortedDetections = [...data.detections].sort((a, b) => a.distance - b.distance);

                // Check if there are significant changes
                if (!hasSignificantChange(sortedDetections, previousDetections)) return;

                previousDetections = sortedDetections;

                // Clear the canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // Update the object list
                objectList.innerHTML = '';
                sortedDetections.forEach(detection => {
                    const { label, distance } = detection;

                    // Add warning if distance is below the threshold
                    const threshold = 0.5; // Distance threshold for warning (meters)
                    const listItem = document.createElement('div');
                    listItem.textContent = `${label}: ${distance.toFixed(2)}m`;

                    if (distance < threshold) {
                        listItem.classList.add('warning');
                        listItem.textContent += ' (TOO CLOSE!)';
                    }

                    objectList.appendChild(listItem);
                });

                // Update the distance line
                const distanceText = sortedDetections
                    .map(detection => {
                        const { label, distance } = detection;
                        if (distance < 0.5) {
                            return `<span class="warning">${label}: ${distance.toFixed(2)}m (TOO CLOSE!)</span>`;
                        }
                        return `${label}: ${distance.toFixed(2)}m`;
                    })
                    .join(' | ');
                distanceLine.innerHTML = distanceText;

                // Draw bounding boxes
                sortedDetections.forEach(detection => {
                    const { box, label, confidence } = detection;
                    const [x1, y1, x2, y2] = box;

                    // Draw bounding box
                    ctx.strokeStyle = "red";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

                    // Draw label and confidence
                    ctx.fillStyle = "red";
                    ctx.font = "16px Arial";
                    ctx.fillText(`${label} (${(confidence * 100).toFixed(2)}%)`, x1, y1 - 10);
                });
            } else {
                // Reset if no detections
                objectList.innerHTML = "No detections found.";
                distanceLine.textContent = "";
            }
        });

        // Access the webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                video.play();
            })
            .catch(err => console.error('Error accessing webcam:', err));

        // Send frames to the backend every 200ms
        setInterval(() => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = canvas.toDataURL('image/jpeg').split(',')[1]; // Get base64 without metadata
            socket.emit('object_detection', { image: frame });
        }, 200);
    </script>
</body>
</html>
